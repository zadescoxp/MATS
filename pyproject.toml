[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mats-trading-framework"
version = "0.1.0"
description = "A local, recoverable, model-agnostic crypto spot trading research framework."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "ccxt==4.5.4",
    "httpx==0.28.1",
    "langchain-core==0.3.74",
    "langchain-openai==0.3.31",
    "langgraph==0.6.6",
    "langgraph-checkpoint-sqlite==2.0.11",
    "litellm==1.75.8",
    "numpy==2.2.6",
    "pandas==2.3.2",
    "pandas-ta-classic==0.3.54",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "sqlalchemy==2.0.43",
    "tenacity==9.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0",
    "ruff==0.12.10",
]

[project.scripts]
mats = "framework.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/framework"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
